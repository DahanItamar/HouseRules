name: Godot checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements-dev.txt
      - run: python tools/check_localization.py
      - run: gdformat --check src tests
      - run: gdlint src tests
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import resources
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: GUT and million-round RTP simulations
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s addons/gut/gut_cmdln.gd -gexit
      - name: Supplemental slot variance diagnosis
        if: always()
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s tests/slot_rtp_diagnostic.gd
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rtp-evidence
          path: tests/results/*.json
